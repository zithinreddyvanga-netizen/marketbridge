<style>
:root{--navy:#101b35;--navy2:#182747;--blue:#4569f5;--cyan:#36c6d9;--ink:#172033;--muted:#718096;--line:#e7ebf3;--bg:#f5f7fb;--white:#fff;--green:#169b72;--amber:#d28b22;--red:#d95c67;--shadow:0 12px 36px rgba(21,37,75,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:linear-gradient(180deg,var(--navy),#111e3b);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:10px;padding:0 9px;font-size:19px;font-weight:800;letter-spacing:-.6px}.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#5476ff,#38c5d8);display:grid;place-items:center;font-weight:900}.brand small{display:block;color:#9eaccb;font-size:9px;letter-spacing:1.6px;font-weight:700}.workspace{padding:0 8px;color:#8292b3;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;margin:0 9px -13px}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#aebbd4;text-align:left;padding:11px 12px;border-radius:10px;display:flex;gap:12px;align-items:center;font-weight:600}.nav button:hover,.nav button.active{background:#26375c;color:#fff}.nav .ico{width:18px;text-align:center;font-size:16px}.side-bottom{margin-top:auto;border-top:1px solid #2b3a5b;padding:17px 8px 0;color:#aebbd4;font-size:12px}.profile-mini{display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;background:#dce5ff;color:#304b9b;display:grid;place-items:center;font-weight:800;flex:none}.main{min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:5}.crumb{color:var(--muted);font-size:12px}.top-actions{display:flex;align-items:center;gap:12px}.role-switch{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;color:#40506b}.icon-btn{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:#fff;position:relative}.dot{position:absolute;width:7px;height:7px;border-radius:50%;background:#f16a78;right:7px;top:7px}.content{padding:30px 34px 55px;max-width:1500px;margin:auto}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}.eyebrow{color:var(--blue);font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.h1{font-size:27px;line-height:1.2;letter-spacing:-.8px;margin:5px 0 7px}.sub{color:var(--muted);margin:0}.btn{padding:10px 15px;border-radius:9px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center}.primary{background:var(--blue);color:#fff;box-shadow:0 5px 14px #4569f533}.primary:hover{background:#3457df}.secondary{background:#fff;border:1px solid var(--line);color:#35425c}.dark{background:var(--navy);color:#fff}.soft{background:#eef2ff;color:#3e5de1}.danger{background:#fff0f1;color:#c14d59}.small{padding:7px 10px;font-size:12px}.grid{display:grid;gap:17px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:19px;box-shadow:0 3px 15px rgba(20,38,75,.025)}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:600}.stat-icon{width:34px;height:34px;border-radius:10px;background:#f0f3ff;display:grid;place-items:center;font-size:16px}.stat-value{font-size:27px;font-weight:800;letter-spacing:-1px;margin:9px 0 2px}.trend{font-size:11px;color:var(--green)}.cols{grid-template-columns:1.55fr 1fr}.section-title{font-size:15px;font-weight:800;margin:0 0 14px}.section-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.muted{color:var(--muted)}.tag{display:inline-flex;align-items:center;padding:4px 8px;border-radius:30px;font-size:10px;font-weight:800;background:#eff2f8;color:#5d6a80}.tag.green{background:#e8f8f2;color:#12825f}.tag.blue{background:#edf1ff;color:#4763e8}.tag.amber{background:#fff5e6;color:#b77a18}.tag.red{background:#fff0f1;color:#c44c59}.project{border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:10px}.project:last-child{margin-bottom:0}.project-head{display:flex;justify-content:space-between;gap:12px}.project h3{font-size:14px;margin:0 0 5px}.project p{font-size:12px;color:var(--muted);margin:0 0 10px}.meta{display:flex;gap:13px;flex-wrap:wrap;color:#68758b;font-size:11px}.skill{display:inline-block;background:#f2f5fa;border-radius:6px;padding:4px 7px;font-size:10px;color:#56637a;margin:7px 4px 0 0}.match{font-size:11px;font-weight:800;color:var(--green);white-space:nowrap}.bar{height:6px;background:#edf0f5;border-radius:9px;overflow:hidden;margin-top:8px}.bar span{height:100%;display:block;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:9px}.activity{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid #f0f2f6}.activity:last-child{border:0}.activity .bubble{width:30px;height:30px;background:#eef2ff;border-radius:9px;display:grid;place-items:center;flex:none}.activity strong{font-size:12px;display:block}.activity small{color:var(--muted);font-size:11px}.empty{padding:35px;text-align:center;color:var(--muted)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:800;color:#58657b}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe5ef;border-radius:9px;padding:10px 11px;outline:none;background:#fff;color:var(--ink)}.field textarea{min-height:95px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#8297ff;box-shadow:0 0 0 3px #4569f51a}.hint{font-size:10px;color:var(--muted)}.modal-back{position:fixed;inset:0;background:#101b3580;z-index:20;display:none;align-items:center;justify-content:center;padding:20px}.modal-back.show{display:flex}.modal{background:#fff;width:min(640px,100%);max-height:90vh;overflow:auto;border-radius:17px;padding:23px;box-shadow:0 20px 80px #101b3540}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{margin:0;font-size:19px}.close{background:#f1f3f8;border-radius:8px;width:30px;height:30px}.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:13px 17px;border-radius:10px;box-shadow:var(--shadow);z-index:50;opacity:0;transform:translateY(12px);transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.tab{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:#617089;font-size:12px;font-weight:700}.tab.active{background:#edf1ff;border-color:#dce3ff;color:#405ee6}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:#8792a5;font-size:10px;text-transform:uppercase;letter-spacing:.8px;padding:11px;border-bottom:1px solid var(--line)}td{padding:13px 11px;border-bottom:1px solid #f0f2f6;vertical-align:middle}.ai-panel{background:linear-gradient(120deg,#17294e,#263e73);color:#fff;border-radius:14px;padding:18px;position:relative;overflow:hidden}.ai-panel:after{content:"✦";position:absolute;right:22px;top:3px;font-size:74px;color:#ffffff13}.ai-panel p{color:#c5d1eb;font-size:12px;max-width:620px}.ai-panel .tag{background:#344c7c;color:#c8d8ff}.match-row{display:grid;grid-template-columns:40px 1fr auto;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid #eef1f6}.match-row:last-child{border:0}.score{font-weight:900;color:var(--green);font-size:13px}.progress-step{display:flex;gap:10px;align-items:center;margin:12px 0;font-size:12px}.step-dot{width:23px;height:23px;border-radius:50%;background:#eaf8f3;color:var(--green);display:grid;place-items:center;font-weight:800}.switch{display:flex;align-items:center;gap:8px;font-size:12px;color:#59677f}.switch input{accent-color:var(--blue)}.plan{border:1px solid var(--line);border-radius:12px;padding:16px}.plan.featured{border:2px solid var(--blue);background:#f8f9ff}.plan h3{margin:0 0 5px}.price{font-size:25px;font-weight:900;margin:9px 0}.notice{background:#fff8e9;border:1px solid #f4e2bc;color:#8c641d;border-radius:10px;padding:12px;font-size:11px}.hide{display:none!important}
@media(max-width:1000px){.app{grid-template-columns:76px 1fr}.sidebar{padding:22px 10px}.brand{padding:0;justify-content:center}.brand-text,.workspace,.nav .label,.side-bottom .user-info{display:none}.nav button{justify-content:center;padding:12px 8px}.side-bottom{padding:14px 8px}.profile-mini{justify-content:center}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){.app{display:block}.sidebar{position:fixed;bottom:0;left:0;right:0;height:64px;z-index:10;padding:5px 8px;display:block}.brand,.workspace,.side-bottom{display:none}.nav{display:flex;justify-content:space-around;gap:2px}.nav button{display:grid;justify-items:center;gap:0;padding:7px 10px;font-size:9px}.nav .label{display:block;font-size:9px}.nav .ico{font-size:17px}.topbar{height:62px;padding:0 15px}.content{padding:22px 14px 90px}.h1{font-size:23px}.page-head{align-items:flex-start}.stats{gap:9px}.card{padding:14px}.cols{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.top-actions{gap:6px}.role-switch{max-width:130px;font-size:10px}.page-head>.btn{font-size:11px;padding:9px}.stat-value{font-size:23px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="logo">M</div><div class="brand-text">MarketBridge<small>MARKETING MARKETPLACE</small></div></div>
 <div class="workspace">WORKSPACE</div>
 <nav class="nav" id="nav">
  <button class="active" data-page="overview"><span class="ico">▦</span><span class="label">Overview</span></button>
  <button data-page="projects"><span class="ico">◫</span><span class="label">Projects</span></button>
  <button data-page="talent"><span class="ico">♙</span><span class="label">Find talent</span></button>
  <button data-page="join"><span class="ico">＋</span><span class="label">Join as talent</span></button>
  <button data-page="proposals"><span class="ico">▤</span><span class="label">Proposals</span></button>
  <button data-page="workspace"><span class="ico">◷</span><span class="label">Workspace</span></button>
  <button data-page="payments"><span class="ico">₹</span><span class="label">Payments</span></button>
  <button data-page="automation"><span class="ico">✧</span><span class="label">AI automation</span></button>
  <button data-page="admin"><span class="ico">⚙</span><span class="label">Admin</span></button>
 </nav>
 <div class="side-bottom"><div class="profile-mini"><div class="avatar">MB</div><div class="user-info"><b>MarketBridge Demo</b><br><span>Workspace owner</span></div></div></div>
</aside>
<main class="main">
<header class="topbar"><div><div class="crumb">Workspace / <b id="crumb">Overview</b></div></div><div class="top-actions">
<select class="role-switch" id="role"><option value="business">Viewing as: Business</option><option value="marketer">Viewing as: Marketer</option><option value="admin">Viewing as: Admin</option></select>
<button class="icon-btn" id="notifyBtn" title="Notifications">♧<span class="dot"></span></button><div class="avatar">ZR</div></div></header>
<div class="content" id="content"></div>
</main>
</div>
<div class="modal-back" id="modalBack"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Create project</h2><button class="close" id="modalClose">×</button></div><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const categories=['Social Media Marketing','SEO','Google Ads','Meta Ads','Content Marketing','Website Development','Branding & Design','Influencer Marketing','Email Marketing','Lead Generation','Digital Strategy','Website Development','App Development','UI/UX Design','Software Development','E-commerce Development','AI & Automation','Mobile App Development','WordPress Development'];
const seed={
 projects:[
 {id:1,title:'Launch campaign for premium skincare brand',company:'GlowTheory',category:'Social Media Marketing',desc:'Plan and execute a 60-day Instagram and Meta campaign. Need creative strategy, reels and performance reporting.',budget:45000,duration:'2 months',skills:['Meta Ads','Content Marketing','Instagram'],status:'Open',created:Date.now()-86400000},
 {id:2,title:'B2B lead generation for SaaS product',company:'CloudPilot',category:'Lead Generation',desc:'Generate qualified demos among mid-market companies in India. LinkedIn outreach and landing page optimization.',budget:65000,duration:'6 weeks',skills:['LinkedIn Ads','Lead Generation','B2B'],status:'Open',created:Date.now()-54000000},
 {id:3,title:'SEO audit and organic growth plan',company:'UrbanNest',category:'SEO',desc:'Technical SEO audit, keyword map and 3-month growth roadmap for a property discovery platform.',budget:30000,duration:'1 month',skills:['SEO','Analytics','Content'],status:'Open',created:Date.now()-25000000},
 {id:4,title:'Brand identity refresh',company:'Nourish Co.',category:'Branding & Design',desc:'Refresh brand identity, packaging direction and social templates for a healthy snacks brand.',budget:38000,duration:'5 weeks',skills:['Branding','Design','FMCG'],status:'In Progress',created:Date.now()-120000000}
 ],
 marketers:[
 {id:1,name:'Aarav Mehta',role:'Performance Marketing Specialist',company:'GrowthCraft Studio',skills:['Meta Ads','Google Ads','Analytics','Lead Generation'],experience:5,rate:1800,rating:4.9,projects:42,about:'Performance marketer focused on measurable acquisition and ROAS.'},
 {id:2,name:'Priya Nair',role:'SEO & Content Strategist',company:'Independent',skills:['SEO','Content Marketing','Analytics','Digital Strategy'],experience:6,rate:1500,rating:4.8,projects:36,about:'Organic growth strategy, technical SEO and content systems.'},
 {id:3,name:'Kabir Shah',role:'B2B Growth Consultant',company:'PipelineWorks',skills:['LinkedIn Ads','Lead Generation','B2B','Email Marketing'],experience:7,rate:2400,rating:5.0,projects:58,about:'Builds repeatable B2B pipeline through outbound and paid acquisition.'},
 {id:4,name:'Meera Iyer',role:'Creative & Social Media Lead',company:'Mango Creative',skills:['Instagram','Meta Ads','Content Marketing','Branding','Design'],experience:4,rate:1600,rating:4.9,projects:31,about:'Creative-led social campaigns for consumer and lifestyle brands.'},
 {id:5,name:'Dev Malhotra',role:'Brand & Digital Designer',company:'Studio North',skills:['Branding','Design','FMCG','Content'],experience:8,rate:2100,rating:4.7,projects:67,about:'Brand systems, packaging and digital-first identity.'}
 ],
 proposals:[
 {id:1,projectId:1,marketerId:4,price:42000,days:45,message:'I can lead the content calendar, creative production and paid campaign optimization. I have delivered similar campaigns for lifestyle brands.',status:'Shortlisted',created:Date.now()-3000000},
 {id:2,projectId:2,marketerId:3,price:60000,days:40,message:'I will build a target account list, run LinkedIn outreach and optimize the demo funnel with weekly pipeline reporting.',status:'Submitted',created:Date.now()-1800000},
 {id:3,projectId:3,marketerId:2,price:28000,days:25,message:'I will complete a technical audit, keyword research, competitor gap analysis and prioritized organic roadmap.',status:'Submitted',created:Date.now()-900000}
 ],
 activities:[
 {icon:'✧',title:'AI matched 4 marketers to GlowTheory campaign',time:'Just now'},
 {icon:'↗',title:'New proposal received for B2B lead generation',time:'18 min ago'},
 {icon:'✓',title:'Meera Iyer shortlisted for skincare campaign',time:'1 hour ago'},
 {icon:'₹',title:'Monthly subscription plan is ready to configure',time:'Today'}
 ],
 transactions:[],notifications:[],contracts:[{id:1,projectId:4,marketerId:5,amount:38000,status:'In progress',milestone:'Brand concepts'}],settings:{commission:10,subscription:1999}
};
let db=loadDB(),page='overview',role='business',proposalFilter='All';
function loadDB(){try{let x=JSON.parse(localStorage.getItem('mb_advanced_db'));return x?{...seed,...x}:structuredClone(seed)}catch(e){return structuredClone(seed)}}
function save(){localStorage.setItem('mb_advanced_db',JSON.stringify(db))}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function initials(s){return s.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function project(id){return db.projects.find(x=>x.id===id)}
function marketer(id){return db.marketers.find(x=>x.id===id)}
function activity(icon,title){db.activities.unshift({icon,title,time:'Just now'});db.activities=db.activities.slice(0,12);save()}
function notify(title,detail=''){db.notifications.unshift({title,detail,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),read:false});save()}
function matchScore(p,m){let skills=(p.skills||[]).map(s=>s.toLowerCase());let ms=m.skills.map(s=>s.toLowerCase());let overlap=skills.filter(s=>ms.some(x=>x.includes(s)||s.includes(x))).length;let skillScore=skills.length?overlap/skills.length:0.35;let exp=Math.min(m.experience/8,1);let budgetFit=p.budget>=m.rate*20?1:.65;let rating=m.rating/5;return Math.round((skillScore*.58+exp*.14+budgetFit*.1+rating*.18)*100)}
function aiMatch(p){return db.marketers.map(m=>({m,score:matchScore(p,m)})).sort((a,b)=>b.score-a.score)}
function matchTag(n){return `<span class="tag ${n>=80?'green':n>=60?'blue':'amber'}">${n}% match</span>`}
function stat(label,value,icon,trend){return `<div class="card"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="trend">${trend}</div></div>`}
function pageHead(title,sub,btn=''){return `<div class="page-head"><div><div class="eyebrow">MARKETBRIDGE WORKSPACE</div><h1 class="h1">${title}</h1><p class="sub">${sub}</p></div>${btn}</div>`}
function projectCard(p,actions=true){let proposals=db.proposals.filter(x=>x.projectId===p.id).length;return `<div class="project"><div class="project-head"><div><h3>${esc(p.title)}</h3><p>${esc(p.company)} · ${esc(p.category)}</p></div><div>${p.status==='Open'?'<span class="tag green">Open</span>':p.status==='In Progress'?'<span class="tag blue">In progress</span>':'<span class="tag">'+esc(p.status)+'</span>'}</div></div><p>${esc(p.desc)}</p><div class="meta"><span>◷ ${esc(p.duration)}</span><span>₹ ${Number(p.budget).toLocaleString('en-IN')} budget</span><span>▤ ${proposals} proposals</span>${p.workmode?`<span>⌖ ${esc(p.workmode)}</span>`:''} </div><div>${(p.skills||[]).map(s=>`<span class="skill">${esc(s)}</span>`).join('')}</div>${actions?`<div style="display:flex;gap:8px;margin-top:13px;flex-wrap:wrap"><button class="btn secondary small" onclick="viewProject(${p.id})">View details</button>${role==='marketer'&&p.status==='Open'?`<button class="btn primary small" onclick="openProposal(${p.id})">Submit proposal</button>`:''}${role==='business'?`<button class="btn soft small" onclick="showMatches(${p.id})">✧ AI matches</button>`:''}</div>`:''}</div>`}
function renderOverview(){let open=db.projects.filter(p=>p.status==='Open').length,active=db.projects.filter(p=>p.status==='In Progress').length,paid=db.transactions.filter(t=>t.status==='Paid').reduce((a,t)=>a+t.amount,0),proposals=db.proposals.length;
let roleIntro=role==='business'?'Your marketing projects, talent pipeline and growth activity in one place.':role==='marketer'?'Discover relevant opportunities and manage your client pipeline.':'Platform performance, marketplace activity and revenue overview.';
let stats=role==='business'?[stat('Open projects',open,'◫','Live opportunities'),stat('Proposals received',proposals,'▤','Across all projects'),stat('Active engagements',active,'◷','Projects in delivery'),stat('Total paid',money(paid),'₹','Verified demo transactions')]:role==='marketer'?[stat('Available projects',open,'◫','Open to applications'),stat('My proposals',db.proposals.filter(p=>p.marketerId===1).length,'▤','Submitted applications'),stat('Shortlisted',db.proposals.filter(p=>p.marketerId===1&&p.status==='Shortlisted').length,'★','Client interest'),stat('Profile rating','4.9/5','☆','Demo profile rating')]:[stat('Registered marketers',db.marketers.length,'♙','Demo marketplace'),stat('Active projects',open+active,'◫','Open + in progress'),stat('Total proposals',proposals,'▤','Applications submitted'),stat('Platform revenue',money(db.transactions.reduce((a,t)=>a+(t.commission||0),0)),'₹','Demo commission ledger')];
let ps=role==='marketer'?db.projects.filter(p=>p.status==='Open').sort((a,b)=>Math.max(...aiMatch(b).map(x=>x.score))-Math.max(...aiMatch(a).map(x=>x.score))).slice(0,3):db.projects.slice(0,3);
return `${pageHead('Good afternoon 👋',roleIntro,role==='business'?'<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn secondary" onclick="go(\'join\')">Join as talent</button><button class="btn primary" onclick="openProject()">＋ Give a project</button></div>':'<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn secondary" onclick="go(\'join\')">Complete talent profile</button><button class="btn primary" onclick="go(\'projects\')">Explore projects →</button></div>')}<div class="grid stats">${stats.join('')}</div><div class="grid cols"><div class="card"><div class="section-row"><h2 class="section-title">${role==='marketer'?'Recommended for you':'Recent projects'}</h2><button class="btn secondary small" onclick="go('projects')">View all →</button></div>${ps.map(projectCard).join('')||'<div class="empty">No projects yet.</div>'}</div><div class="card"><div class="section-row"><h2 class="section-title">Live activity</h2><span class="tag blue">Updated</span></div>${db.activities.slice(0,6).map(a=>`<div class="activity"><div class="bubble">${a.icon}</div><div><strong>${esc(a.title)}</strong><small>${esc(a.time)}</small></div></div>`).join('')}</div></div><div class="ai-panel" style="margin-top:18px"><span class="tag">✧ MARKETBRIDGE AI</span><h2 style="margin:12px 0 4px">Smarter connections. Better outcomes.</h2><p>Our matching engine compares project requirements, marketer skills, experience, budget fit and ratings to recommend the most relevant talent. Open AI automation to review matches and workflow triggers.</p><button class="btn" style="background:#fff;color:#213b75" onclick="go('automation')">Explore AI automation →</button></div>`}

<div class="field full"><button class="btn primary" type="submit">Publish project & find matching professionals</button></div></form>`);$('#projectForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),id=Math.max(0,...db.projects.map(p=>p.id))+1,p={id,title:f.get('title'),company:f.get('company'),category:f.get('category'),budget:+f.get('budget'),duration:f.get('duration'),desc:f.get('desc')+' Scope: '+f.get('scope')+' Deliverables: '+f.get('deliverables'),skills:f.get('skills').split(',').map(x=>x.trim()).filter(Boolean),status:'Open',created:Date.now(),workmode:f.get('workmode'),start:f.get('start'),audience:f.get('audience'),level:f.get('level'),deliverables:f.get('deliverables'),kpis:f.get('kpis'),reference:f.get('reference'),notes:f.get('notes')};db.projects.unshift(p);let matches=aiMatch(p).filter(x=>x.score>=40);activity('✧',`AI matched ${matches.length} professionals to ${p.company} project`);notify('Project published',`${matches.length} relevant professionals matched to ${p.title}`);save();closeModal();render();toast(`Project published. ${matches.length} professionals matched.`)}}
function openProposal(id){let p=project(id);openModal('Submit a proposal',`<p class="muted" style="font-size:12px;margin-top:-8px">${esc(p.title)} · ${esc(p.company)}</p><form id="proposalForm" class="form-grid"><div class="field"><label>Your quote (₹)</label><input name="price" type="number" min="1000" value="${Math.round(p.budget*.9)}" required></div><div class="field"><label>Delivery time (days)</label><input name="days" type="number" min="1" value="30" required></div><div class="field full"><label>Why are you right for this project?</label><textarea name="message" required minlength="30" placeholder="Explain your approach, relevant experience and expected outcomes..."></textarea><span class="hint">The AI proposal quality checker looks for a clear approach, experience and deliverables.</span></div><div class="field full"><button class="btn primary">Submit proposal & notify business</button></div></form>`);$('#proposalForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),m=role==='marketer'?db.marketers[0]:db.marketers[0],prop={id:Math.max(0,...db.proposals.map(x=>x.id))+1,projectId:id,marketerId:m.id,price:+f.get('price'),days:+f.get('days'),message:f.get('message'),status:'Submitted',created:Date.now()};db.proposals.unshift(prop);activity('↗',`${m.name} submitted a proposal for ${p.title}`);notify('New proposal received',`${m.name} quoted ${money(prop.price)} for ${p.title}`);save();closeModal();go('proposals');toast('Proposal submitted and business notified.')}}
function viewProject(id){let p=project(id),ms=aiMatch(p).slice(0,3);openModal('Project details',`<h3>${esc(p.title)}</h3><p class="muted">${esc(p.company)} · ${esc(p.category)} · ${money(p.budget)}</p><p>${esc(p.desc)}</p><p><b>Skills:</b> ${(p.skills||[]).map(esc).join(', ')}</p><p><b>Status:</b> ${p.status}</p><h3 style="font-size:14px;margin-top:20px">✧ AI recommended talent</h3>${ms.map(x=>`<div class="match-row"><div class="avatar">${initials(x.m.name)}</div><div><b>${esc(x.m.name)}</b><div class="muted">${esc(x.m.role)}</div></div><div class="score">${x.score}%</div></div>`).join('')}${role==='marketer'&&p.status==='Open'?`<button class="btn primary" style="margin-top:15px" onclick="closeModal();openProposal(${p.id})">Submit proposal</button>`:''}`)}
function showMatches(id){let p=project(id),ms=aiMatch(p);openModal('AI talent recommendations',`<p class="muted" style="font-size:12px">Ranked recommendations for: <b>${esc(p.title)}</b></p>${ms.map(x=>`<div class="match-row"><div class="avatar">${initials(x.m.name)}</div><div><b>${esc(x.m.name)}</b><div class="muted" style="font-size:11px">${esc(x.m.role)} · ${x.m.experience} years</div><div class="bar"><span style="width:${x.score}%"></span></div></div><div class="score">${x.score}%</div></div>`).join('')}<p class="hint">Score combines skill overlap (58%), experience (14%), budget fit (10%) and rating (18%).</p>`)}
function refreshMatches(){let id=+$('#matchProject').value,p=project(id);$('#matchResults').innerHTML=aiMatch(p).map(x=>`<div class="match-row"><div class="avatar">${initials(x.m.name)}</div><div><b>${esc(x.m.name)}</b><div class="muted" style="font-size:11px">${esc(x.m.role)}</div><div class="bar"><span style="width:${x.score}%"></span></div></div><div class="score">${x.score}%</div></div>`).join('')}
function shortlist(id){let p=db.proposals.find(x=>x.id===id);p.status='Shortlisted';activity('★',`${marketer(p.marketerId).name} shortlisted for ${project(p.projectId).title}`);notify('You have been shortlisted',project(p.projectId).title);save();render();toast('Marketer shortlisted and notified.')}
function acceptProposal(id){let p=db.proposals.find(x=>x.id===id);if(db.contracts.some(c=>c.projectId===p.projectId)){toast('A contract already exists for this project.');return}p.status='Accepted';db.proposals.filter(x=>x.projectId===p.projectId&&x.id!==id).forEach(x=>x.status='Rejected');let pr=project(p.projectId);pr.status='In Progress';db.contracts.unshift({id:Math.max(0,...db.contracts.map(x=>x.id))+1,projectId:p.projectId,marketerId:p.marketerId,amount:p.price,status:'In progress',milestone:'Kick-off & discovery'});activity('✓',`${marketer(p.marketerId).name} hired for ${pr.title}`);notify('Proposal accepted','Contract workspace created for '+pr.title);save();render();toast('Marketer hired. Project workspace created.')}
function updateMilestone(id){let c=db.contracts.find(x=>x.id===id),steps=['Kick-off & discovery','Strategy and planning','Execution and optimization','Final review & approval','Completed'];let i=steps.indexOf(c.milestone);c.milestone=steps[Math.min(i+1,steps.length-1)];if(c.milestone==='Completed'){c.status='Completed';let p=project(c.projectId);p.status='Completed';notify('Project completed','Please leave a review for your collaborator.')}activity('◷','Milestone updated: '+c.milestone);save();render();toast('Project milestone updated.')}
function contactMarketer(id){let m=marketer(id);notify('Contact request prepared','Reach out to '+m.name);toast('Contact request logged. Messaging needs a live backend to deliver across accounts.')}
function saveCommission(){let n=+$('#commission').value;if(n<0||n>30){toast('Choose a commission between 0% and 30%.');return}db.settings.commission=n;save();toast('Commission setting saved.')}
function saveSub(){let n=+$('#subPrice').value;if(n<0){toast('Enter a valid subscription price.');return}db.settings.subscription=n;save();toast('Subscription price saved.')}
function demoCheckout(){let c=db.contracts.find(x=>x.status==='In progress');if(!c){toast('Accept a proposal first to create a contract.');return}let commission=Math.round(c.amount*db.settings.commission/100);db.transactions.unshift({ref:'MB-DEMO-'+Date.now().toString().slice(-7),amount:c.amount,commission,status:'Paid (demo)',date:new Date().toLocaleDateString('en-IN')});activity('₹',`Demo payment recorded: ${money(c.amount)} gross, ${money(commission)} platform fee`);notify('Demo payment recorded','No real money was collected.');save();render();toast('Demo transaction recorded. No real payment was taken.')}
function runMatching(){let count=0;db.projects.filter(p=>p.status==='Open').forEach(p=>{let m=aiMatch(p).filter(x=>x.score>=60);count+=m.length;notify('AI match recommendations',`${m.length} marketers match ${p.title}`)});activity('✧',`AI matching run completed: ${count} relevant matches identified`);save();render();toast(`Matching complete: ${count} recommendations generated.`)}
function exportTransactions(){let rows=['Reference,Gross,Commission,Status,Date',...db.transactions.map(t=>[t.ref,t.amount,t.commission,t.status,t.date].join(','))];download('marketbridge-transactions.csv',rows.join('\\n'),'text/csv')}
function exportData(){download('marketbridge-demo-data.json',JSON.stringify(db,null,2),'application/json')}
function download(name,data,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function resetDemo(){if(confirm('Reset all MarketBridge demo data to the original sample?')){localStorage.removeItem('mb_advanced_db');db=structuredClone(seed);save();go('overview');toast('Demo data reset.')}}
